
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Порівняння відеокарт</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header class="page-header">
            <h1>Порівняння відеокарт</h1>
            <p>Порівняй характеристики популярних моделей GPU</p>
        </header>

        <section class="table-section">
            <table>
                <caption>Технічні характеристики відеокарт</caption>

                <thead>
                    <tr>
                        <th scope="col">Відеокарта</th>
                        <th scope="col">Пам'ять</th>
                        <th scope="col">Тип пам'яті</th>
                        <th scope="col">Рік випуску</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <th scope="row">RTX 2050</th>
                        <td>4 GB</td>
                        <td>GDDR6</td>
                        <td>2022</td>
                    </tr>

                    <tr>
                        <th scope="row">RTX 3050</th>
                        <td>8 GB</td>
                        <td>GDDR6</td>
                        <td>2022</td>
                    </tr>

                    <tr>
                        <th scope="row">RTX 4060</th>
                        <td>8 GB</td>
                        <td>GDDR6</td>
                        <td>2023</td>
                    </tr>

                    <tr>
                        <th scope="row">RTX 4070</th>
                        <td>12 GB</td>
                        <td>GDDR6X</td>
                        <td>2023</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <footer>
            <p>Навчальний проєкт з HTML та CSS</p>
        </footer>
    </main>

</body>
</html>
